# Blueprint for Alex's workspace (tea-dap4tfoae00c7393c5hg).
# Create the service only after this repo is on GitHub.
services:
  - type: web
    name: toolbox-api
    runtime: python
    plan: free
    region: singapore
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://noowxela.github.io
